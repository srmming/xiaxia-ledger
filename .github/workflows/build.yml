# 合并前检查：编译、跑测试、编译 Mac 和 iPhone 两个 app，用示例数据（全是编的）截图。
# 仓库私有后 Mac 机器按 10 倍扣免费额度，所以平时推送不跑（Mac 上本地 swift build && swift test 代替），
# 只在 PR 标成「可以审了」（不是草稿）和之后再推送时跑，也可以在 Actions 页手动点 Run workflow。
# 截图和日志推到 ci-output 分支，方便不在 Mac 前也能看到 app 的样子。
name: build
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 60  # 截图越来越多（2026-11-23 四个改动一起加），40 分钟跑到 Mac 截图就被掐断
    steps:
      - uses: actions/checkout@v4
      # 快速模式（2026-11-25 ming 嫌一轮一个多小时太慢）：仓库里有 ci/mode 写着 mac 时，只编 Mac app、只截 ci/shots 里列的几张，
      # 不跑 swift build/test、fin、iPhone 编译和界面测试。合并前删掉 ci/mode，完整跑一遍。
      - name: 看是不是快速模式
        run: |
          if [ "$(cat ci/mode 2>/dev/null)" = "mac" ]; then echo "MAC_ONLY=1" >> "$GITHUB_ENV"; echo "SHOTS=$(cat ci/shots 2>/dev/null)" >> "$GITHUB_ENV"; echo "快速模式：只编 Mac、只截改到的页"; fi
      - name: 工具版本
        run: |
          mkdir -p ci-out
          xcodebuild -version | tee ci-out/versions.txt
          swift --version 2>&1 | tee -a ci-out/versions.txt
      - name: swift build
        if: ${{ env.MAC_ONLY != '1' }}
        run: set -o pipefail; swift build 2>&1 | tee ci-out/swift-build.log
      - name: swift test
        if: ${{ env.MAC_ONLY != '1' }}
        run: set -o pipefail; swift test 2>&1 | tee ci-out/swift-test.log
      - name: fin 和 MCP 实际跑一遍（临时示例账本）
        if: ${{ env.MAC_ONLY != '1' }}
        run: set -o pipefail; bash scripts/fin-smoke.sh .build/debug/fin 2>&1 | tee ci-out/fin-smoke.log
      - name: 全局安装脚本（在假的 HOME 里试装）
        if: ${{ env.MAC_ONLY != '1' }}
        run: |
          set -o pipefail
          FAKE=$(mktemp -d); mkdir -p "$FAKE/.claude" "$FAKE/.codex" "$FAKE/Library/Application Support/Claude"
          for i in 1 2; do HOME=$FAKE XIAXIA_SKIP_BUILD=1 XIAXIA_FIN_BINARY=$PWD/.build/debug/fin PATH=/usr/bin:/bin bash scripts/install-global.sh; done 2>&1 | tee ci-out/install-global.log
          { echo; ls -la "$FAKE/.claude/skills" "$FAKE/.agents/skills"; cat "$FAKE/.codex/config.toml"; cat "$FAKE/Library/Application Support/Claude/claude_desktop_config.json"; grep -c xiaxia-ledger:start "$FAKE/.codex/AGENTS.md"; } 2>&1 | tee -a ci-out/install-global.log
          test "$(grep -c xiaxia-ledger:start "$FAKE/.codex/AGENTS.md")" = 1
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "$FAKE/.local/bin/fin" mcp | grep -q xiaxia-ledger
      - name: 生成 Xcode 工程
        run: |
          which xcodegen || brew install xcodegen
          cd App && xcodegen generate
      - name: 编译 Mac app
        run: |
          set -o pipefail
          xcodebuild -project App/XiaxiaLedger.xcodeproj -scheme XiaxiaLedger-macOS -configuration Debug \
            -derivedDataPath App/build -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build 2>&1 | tee ci-out/xcode-mac.log | grep -E "error|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" ci-out/xcode-mac.log
      - name: Mac app 里带了 fin（连 AI 要用它）
        run: |
          set -o pipefail
          APP="$(find App/build/Build/Products/Debug -name '*.app' -maxdepth 1 | head -1)"
          ls -la "$APP/Contents/MacOS" | tee ci-out/mac-bundle.txt
          "$APP/Contents/MacOS/fin" --help | head -3
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"clientInfo":{"name":"ci"}}}' \
            | XIAXIA_LEDGER_PATH="$(mktemp -d)/ledger.json" "$APP/Contents/MacOS/fin" mcp | grep -q xiaxia-ledger
      - name: 编译 iPhone app
        if: ${{ env.MAC_ONLY != '1' }}
        run: |
          set -o pipefail
          xcodebuild -project App/XiaxiaLedger.xcodeproj -scheme XiaxiaLedger-iOS -configuration Debug \
            -derivedDataPath App/build -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-out/xcode-ios.log | grep -E "error|BUILD" || true
          grep -q "BUILD SUCCEEDED" ci-out/xcode-ios.log
      - name: iPhone 界面自动检查（空账本 / 示例账本，都在内存里，不碰真账本）
        if: ${{ env.MAC_ONLY != '1' }}
        run: |
          set -o pipefail
          DEVICE="$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]( Pro)? \(' | head -1 | grep -oE '[0-9A-F-]{36}')"
          xcodebuild -project App/XiaxiaLedger.xcodeproj -scheme XiaxiaLedger-iOS -configuration Debug \
            -derivedDataPath App/build-test -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test 2>&1 \
            | tee ci-out/ui-tests.log | grep -E "error|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" ci-out/ui-tests.log
      - name: 截图（示例数据）
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/screenshots.sh ci-out/shots
      - name: 把日志和截图推到 ci-output 分支
        if: always()
        run: |
          cd ci-out
          grep -hE "error:" *.log | sort -u | head -200 > errors.txt || true
          echo "${{ github.sha }}" > commit.txt
          git init -q -b ci-output
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "ci output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-output
