# 用 XcodeGen 生成 Xcode 工程：cd App && xcodegen generate
# 生成的 .xcodeproj 不进 git，改工程只改这个文件。
name: XiaxiaLedger
options:
  bundleIdPrefix: com.srmming
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: zh-Hans
packages:
  XiaxiaLedgerKit:
    path: ..
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
  # Mac 版自动更新（App Store 以外的 Mac app 通用做法）。只给 Mac 用，iPhone 不带。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    # iCloud 同步要用的权限只在正式签名时带上：xcodebuild … XIAXIA_ICLOUD=YES。
    # 不签名 / 临时签名（CI、本机 Debug）带着 iCloud 权限，Mac 会直接拒绝打开 app，所以平时留空。
    XIAXIA_ENTITLEMENTS_YES_iOS: Entitlements/iOS.entitlements
    XIAXIA_ENTITLEMENTS_YES_macOS: Entitlements/macOS.entitlements
    MARKETING_VERSION: "0.1.0"
    # Sparkle 更新签名的公钥（不是秘密）。第一次在 ming 的 Mac 上跑 Sparkle 的 generate_keys 生成后填这里。
    XIAXIA_SPARKLE_PUBLIC_KEY: ""
    # 自动更新的网址前缀（只改这一处）：<前缀>/appcast.xml 是更新清单，<前缀>/download/xiaxia-ledger-<版本>.dmg 是安装包。
    # 官网域名定了就换成 https://<域名>；之前先用只放安装包的公开仓库 srmming/xiaxia-ledger-releases。
    XIAXIA_UPDATE_BASE: https://raw.githubusercontent.com/srmming/xiaxia-ledger-releases/main
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  XiaxiaLedger-iOS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: XiaxiaLedgerKit
        product: LedgerUI
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: 夏夏账本
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        NSUbiquitousContainers:
          iCloud.com.srmming.xiaxia-ledger:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 夏夏账本
            NSUbiquitousContainerSupportedFolderLevels: Any
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger
        PRODUCT_NAME: 夏夏账本
        CODE_SIGN_ENTITLEMENTS: $(XIAXIA_ENTITLEMENTS_$(XIAXIA_ICLOUD)_iOS)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  # fin（命令行 + MCP 服务）跟着 Mac app 走：装好 app 就有，放在 夏夏账本.app/Contents/MacOS/fin。
  # 「连上你的 AI」把各 AI 工具的 MCP 配置指到这里，别人不用自己编译、不用装命令行。
  fin-tool:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/fin
    dependencies:
      - package: XiaxiaLedgerKit
        product: FinanceCore
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: fin
        PRODUCT_MODULE_NAME: FinTool
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger.fin
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
  XiaxiaLedger-macOS:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: XiaxiaLedgerKit
        product: LedgerUI
      - target: fin-tool
        embed: true
        link: false
        copy:
          destination: executables
      - package: Sparkle
        product: Sparkle
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.finance
        # 自动更新：每天看一次 appcast，有新版就在后台下载，退出时换好（docs/DISTRIBUTE.md「自动更新」）。
        # 更新包用 EdDSA 签名，私钥只在 ming 的 Mac 钥匙串里，这里是公钥。
        SUFeedURL: $(XIAXIA_UPDATE_BASE)/appcast.xml
        SUPublicEDKey: $(XIAXIA_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        # 默认后台下载、下次打开就是新版，不弹窗（2026-11-23 ming：「软件可以自己更新吗？」）。设置里能关。
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        NSUbiquitousContainers:
          iCloud.com.srmming.xiaxia-ledger:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 夏夏账本
            NSUbiquitousContainerSupportedFolderLevels: Any
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger.mac
        PRODUCT_NAME: 夏夏账本
        CODE_SIGN_ENTITLEMENTS: $(XIAXIA_ENTITLEMENTS_$(XIAXIA_ICLOUD)_macOS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 自用分发，不开沙盒，和 fin 读同一份账本（见 docs/ROADMAP.md 决定记录）。
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
      configs:
        # 开发用的 Debug 版换一个名字和 Bundle ID，免得程序坞 / Spotlight 把 build 文件夹里的旧 Debug 包当成正式的「夏夏账本」打开
        # （2026-11-21 出过一次：旧 Debug 包读不懂新账本，整窗显示「账本读不出来」）。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger.mac.debug
          PRODUCT_NAME: 夏夏账本 Debug
  # iPhone 界面自动检查：从零新建账本、账户、记一笔，都在内存里的空账本 / 示例账本上做，不碰真账本。
  XiaxiaLedger-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XiaxiaLedger-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XiaxiaLedger-iOS
        CODE_SIGN_STYLE: Automatic
schemes:
  XiaxiaLedger-iOS:
    build: { targets: { XiaxiaLedger-iOS: all } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [XiaxiaLedger-iOSUITests]
  XiaxiaLedger-macOS:
    build: { targets: { XiaxiaLedger-macOS: all, fin-tool: all } }
    run: { config: Debug }
