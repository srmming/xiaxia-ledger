# 用 XcodeGen 生成 Xcode 工程：cd App && xcodegen generate
# 生成的 .xcodeproj 不进 git，改工程只改这个文件。
name: XiaxiaLedger
options:
  bundleIdPrefix: com.srmming
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: zh-Hans
packages:
  XiaxiaLedgerKit:
    path: ..
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  XiaxiaLedger-iOS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: XiaxiaLedgerKit
        product: LedgerUI
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: 夏夏账本
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger
        PRODUCT_NAME: 夏夏账本
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  XiaxiaLedger-macOS:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: XiaxiaLedgerKit
        product: LedgerUI
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: 夏夏账本
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srmming.xiaxia-ledger.mac
        PRODUCT_NAME: 夏夏账本
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 自用分发，不开沙盒，和 fin 读同一份账本（见 docs/ROADMAP.md 决定记录）。
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  XiaxiaLedger-iOS:
    build: { targets: { XiaxiaLedger-iOS: all } }
    run: { config: Debug }
  XiaxiaLedger-macOS:
    build: { targets: { XiaxiaLedger-macOS: all } }
    run: { config: Debug }
