<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>夏夏账本 · 总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D6}a:hover{color:#084FA8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #ECECEC; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #C9C9C9">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #F6F6F6; border-bottom: 1px solid #D8D8D8">
    <div style="display: flex; gap: 8px; width: 204px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
    </div>
    <div style="font-size: 15px; font-weight: 600">总览</div>
    <div style="flex-grow: 1"></div>
    <div role="group" aria-label="账本" style="display: flex; background: #E3E3E3; border-radius: 7px; padding: 2px; gap: 2px">
      <sc-for list="{{books}}" as="b" hint-placeholder-count="3">
        <button onClick="{{b.pick}}" style="{{b.style}}">{{b.name}}</button>
      </sc-for>
    </div>
    <div style="flex-grow: 1"></div>
    <button aria-label="记一笔" style="height: 28px; padding: 0 12px; border: 1px solid #CFCFCF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round"></path></svg>记一笔
    </button>
    <div style="width: 200px; height: 28px; border-radius: 6px; background: #E3E3E3; display: flex; align-items: center; padding: 0 10px; gap: 6px; color: #6E6E73; font-size: 13px">
      <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.2" stroke="#6E6E73" stroke-width="1.4" fill="none"></circle><path d="M8.6 8.6l3.2 3.2" stroke="#6E6E73" stroke-width="1.4" stroke-linecap="round"></path></svg>搜索流水
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <nav aria-label="侧边栏" style="width: 220px; flex-shrink: 0; background: #E8E6EA; border-right: 1px solid #D4D4D4; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 6px 8px">夏夏账本</div>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #D5D3DA; color: #1D1D1F; text-decoration: none; font-weight: 600">▦ 总览</a>
      <a href="Trends.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">↗ 趋势与分类</a>
      <a href="Transactions.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">☰ 流水</a>
      <a href="Pending.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none; justify-content: space-between"><span>◎ 待确认</span><span style="background: #FF7A59; color: #3A1206; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 1px 7px">3</span></a>
      <a href="Import.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">⇩ 导入</a>
      <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 16px 8px 6px">账户</div>
      <sc-for list="{{accounts}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; padding: 5px 8px; color: #3A3A3C"><span>{{a.name}}</span><span style="font-variant-numeric: tabular-nums">{{a.balance}}</span></div>
      </sc-for>
    </nav>
    <main style="flex-grow: 1; background: #FFFFFF; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">2026 年 11 月 · {{bookName}}</h1>
        <div style="font-size: 12px; color: #6E6E73">数据截至 11 月 20 日 · 示例数据</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <div style="background: #F5F5F7; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: #6E6E73">本月收入</div>
          <div style="font-size: 24px; font-weight: 600; color: #136B5E; font-variant-numeric: tabular-nums">{{kpi.income}}</div>
        </div>
        <div style="background: #F5F5F7; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: #6E6E73">本月支出</div>
          <div style="font-size: 24px; font-weight: 600; color: #B4410C; font-variant-numeric: tabular-nums">{{kpi.expense}}</div>
        </div>
        <div style="background: #F5F5F7; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: #6E6E73">结余</div>
          <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">{{kpi.net}}</div>
        </div>
        <div style="background: #F5F5F7; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: #6E6E73">账户总额</div>
          <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">{{kpi.total}}</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; flex-grow: 1; min-height: 0">
        <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 14px; font-weight: 600">近 6 个月收支</h2><div style="display: flex; gap: 12px; font-size: 11px; color: #6E6E73"><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #2E9E8F"></span> 收入</span><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #F08A4B"></span> 支出</span></div></div>
          <div style="flex-grow: 1; display: flex; align-items: flex-end; gap: 18px; padding: 8px 4px 0; border-bottom: 1px solid #E5E5EA">
            <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
                <div style="display: flex; align-items: flex-end; gap: 4px; height: 180px">
                  <div style="{{m.inStyle}}"></div>
                  <div style="{{m.outStyle}}"></div>
                </div>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; gap: 18px; padding: 0 4px; font-size: 11px; color: #6E6E73">
            <sc-for list="{{months}}" as="m" hint-placeholder-count="6"><div style="flex: 1; text-align: center">{{m.label}}</div></sc-for>
          </div>
        </section>
        <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 14px; font-weight: 600">本月花在哪</h2>
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{c.name}}</span><span style="font-variant-numeric: tabular-nums">{{c.amount}}</span></div>
              <div style="height: 6px; background: #F0F0F2; border-radius: 3px"><div style="{{c.barStyle}}"></div></div>
            </div>
          </sc-for>
          <div style="flex-grow: 1"></div>
          <div style="display: flex; align-items: center; gap: 10px; background: #FFF4EE; border-radius: 8px; padding: 10px 12px; font-size: 13px">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF7A59"></span>
            <span style="flex-grow: 1">Claude 导入了 11 月 Revolut 对账单，有 3 项等你确认</span>
            <a href="Pending.dc.html" style="font-weight: 600">去确认</a>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { book: 'all' }; }
  renderVals() {
    const data = {
      all: { name: '全部', kpi: { income: '6.412,00 €', expense: '-4.988,35 €', net: '1.423,65 €', total: '18.730,42 €' },
        series: [[5900,4700],[6100,5200],[5600,4400],[6800,5600],[6200,4900],[6412,4988]],
        cats: [['房租', 1450], ['店铺耗材', 862.4], ['餐饮', 618.2], ['工资', 1200], ['交通', 214.5]] },
      personal: { name: '个人', kpi: { income: '2.900,00 €', expense: '-2.310,75 €', net: '589,25 €', total: '9.204,18 €' },
        series: [[2600,2100],[2800,2400],[2500,2000],[3000,2600],[2700,2200],[2900,2310]],
        cats: [['房租', 950], ['餐饮', 618.2], ['交通', 214.5], ['订阅', 64.97], ['其他', 463.08]] },
      miora: { name: 'Miora 美甲店', kpi: { income: '5.312,00 €', expense: '-4.477,60 €', net: '834,40 €', total: '9.526,24 €' },
        series: [[4700,3900],[4900,4200],[4600,3800],[5400,4600],[5100,4100],[5312,4477]],
        cats: [['工资', 1200], ['店铺耗材', 862.4], ['老板提款', 1800], ['店租', 500], ['水电网', 115.2]] },
    };
    const d = data[this.state.book];
    const fmt = (n) => { const [i, f] = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + f + ' €'; };
    const max = 7000;
    const labels = ['6月', '7月', '8月', '9月', '10月', '11月'];
    const catMax = Math.max(...d.cats.map(c => c[1]));
    const seg = (on) => 'border: 0; border-radius: 5px; padding: 4px 14px; font: inherit; font-size: 13px; min-height: 24px; cursor: pointer; ' + (on ? 'background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.18); font-weight: 600; color: #1D1D1F' : 'background: transparent; color: #3A3A3C');
    return {
      bookName: d.name,
      kpi: d.kpi,
      books: [['all', '全部'], ['personal', '个人'], ['miora', 'Miora 美甲店']].map(([id, name]) => ({ name, style: seg(this.state.book === id), pick: () => this.setState({ book: id }) })),
      accounts: [{ name: 'CaixaBank', balance: '7.812,30 €' }, { name: 'imagin', balance: '3.406,77 €' }, { name: 'Revolut', balance: '6.921,35 €' }, { name: '现金', balance: '590,00 €' }],
      months: d.series.map((s, i) => ({ label: labels[i],
        inStyle: 'width: 18px; border-radius: 4px 4px 0 0; background: #2E9E8F; height: ' + Math.round(s[0] / max * 180) + 'px',
        outStyle: 'width: 18px; border-radius: 4px 4px 0 0; background: #F08A4B; height: ' + Math.round(s[1] / max * 180) + 'px' })),
      cats: d.cats.map(c => ({ name: c[0], amount: fmt(-c[1]), barStyle: 'height: 6px; border-radius: 3px; background: #F08A4B; width: ' + Math.round(c[1] / catMax * 100) + '%' })),
    };
  }
}
</script>
</body>
</html>
