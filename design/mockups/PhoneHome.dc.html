<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>夏夏账本 iPhone · 总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#D9472B}a:hover{color:#B23A22}
@keyframes xx-pulse{0%{r:5;opacity:.5}100%{r:15;opacity:0}}
.xx-halo{animation:xx-pulse 1.8s ease-out infinite}
.xx-press:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; border-radius: 48px; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif; color: #1D1D1F; box-shadow: 0 0 0 10px #1D1D1F, 0 30px 60px rgba(0,0,0,.25)">
  <div style="padding: 58px 18px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #86868B; font-weight: 500">11 月 20 日 星期五</span><h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">总览</h1></div>
      <a href="PhoneAdd.dc.html" aria-label="记一笔" class="xx-press" style="width: 40px; height: 40px; border-radius: 20px; background: #FF6B4A; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(255,107,74,.35); margin-bottom: 4px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    </div>
    <div role="group" aria-label="账本" style="display: flex; background: rgba(118,118,128,.12); border-radius: 9px; padding: 2px; position: relative">
      <div style="{{thumb}}"></div>
      <sc-for list="{{books}}" as="b" hint-placeholder-count="3"><button onClick="{{b.pick}}" style="{{b.style}}">{{b.name}}</button></sc-for>
    </div>
    <section style="background: #FFFFFF; border-radius: 22px; padding: 18px 18px 10px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #86868B">本月结余 · {{bookName}}</span>
      <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.15">{{net}}</span>
      <div style="display: flex; gap: 14px; font-size: 13px; font-variant-numeric: tabular-nums"><span style="color: #1F8A5B; font-weight: 600">↑ {{income}}</span><span style="color: #3A3A3C; font-weight: 600">↓ {{expense}}</span></div>
      <svg width="318" height="110" viewBox="0 0 318 110" role="img" aria-label="1 到 11 月每月结余走势" style="margin-top: 6px">
        <defs><linearGradient id="xxPArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B4A" stop-opacity="0.3"></stop><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"></stop></linearGradient></defs>
        <path d="{{area}}" fill="url(#xxPArea)"></path>
        <path d="{{line}}" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle class="xx-halo" cx="{{lastX}}" cy="{{lastY}}" r="5" fill="#FF6B4A"></circle>
        <circle cx="{{lastX}}" cy="{{lastY}}" r="4" fill="#FFFFFF" stroke="#FF6B4A" stroke-width="2.5"></circle>
      </svg>
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #AEAEB2; padding: 0 2px"><span>1月</span><span>3月</span><span>5月</span><span>7月</span><span>9月</span><span>11月</span></div>
    </section>
    <a href="PhonePending.dc.html" class="xx-press" style="background: #FFFFFF; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; color: #1D1D1F; text-decoration: none; font-size: 15px">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #FFEDE8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="#FF6B4A" stroke-width="1.8"></circle><path d="M5.5 8.2l1.8 1.8 3.4-3.6" fill="none" stroke="#FF6B4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="flex-grow: 1">3 项改动等你确认</span><span style="color: #C7C7CC; font-size: 18px">›</span>
    </a>
    <section style="background: #FFFFFF; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 17px; font-weight: 600">钱花在哪</h2><span style="font-size: 13px; color: #86868B">本月</span></div>
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #F0F0F2; gap: 2px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><div style="{{c.bar}}"></div></sc-for></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 8px; column-gap: 14px; font-size: 13px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 7px"><span style="{{c.dot}}"></span><span style="flex-grow: 1">{{c.name}}</span><span style="color: #86868B; font-variant-numeric: tabular-nums">{{c.amt}}</span></div></sc-for>
      </div>
    </section>
  </div>
  <nav aria-label="标签栏" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(249,249,249,.88); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,.08); display: flex; justify-content: space-around; padding-top: 8px; box-sizing: border-box; font-size: 10px; font-weight: 500">
    <a href="PhoneHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #FF6B4A; text-decoration: none; width: 70px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="#FF6B4A"></rect><rect x="13" y="3" width="8" height="8" rx="2.5" fill="#FF6B4A"></rect><rect x="3" y="13" width="8" height="8" rx="2.5" fill="#FF6B4A"></rect><rect x="13" y="13" width="8" height="8" rx="2.5" fill="#FF6B4A"></rect></svg>总览</a>
    <a href="PhoneHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; text-decoration: none; width: 70px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"></path></svg>流水</a>
    <a href="PhonePending.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; text-decoration: none; width: 70px; position: relative"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#8E8E93" stroke-width="2"></circle><path d="M8 12.3l2.7 2.7 5.3-5.5" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>待确认<span style="position: absolute; top: -3px; left: 40px; background: #FF3B30; color: #FFFFFF; font-size: 11px; font-weight: 700; border-radius: 9px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="PhoneHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; text-decoration: none; width: 70px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="#8E8E93" stroke-width="2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"></path></svg>设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { book: 'all', p: 0 };
    this.DATA = {
      all: { name: '全部', income: 6412, expense: 4988.35, series: [820, 1104, 640, 1320, 980, 1210, 900, 1200, 1200, 1300, 1423.65],
        cats: [['房租', 1950], ['工资', 1200], ['耗材', 862.4], ['餐饮', 618.2], ['其他', 357.75]] },
      personal: { name: '个人', income: 2900, expense: 2310.75, series: [310, 420, 180, 560, 400, 520, 330, 600, 480, 610, 589.25],
        cats: [['房租', 950], ['餐饮', 618.2], ['超市', 402.6], ['交通', 214.5], ['其他', 125.45]] },
      miora: { name: 'Miora 美甲店', income: 5312, expense: 4477.6, series: [510, 684, 460, 760, 580, 690, 570, 600, 720, 690, 834.4],
        cats: [['老板提款', 1800], ['工资', 1200], ['耗材', 862.4], ['店租', 500], ['水电', 115.2]] },
    };
    this.ZERO = { income: 0, expense: 0, series: new Array(11).fill(0), cats: [0, 0, 0, 0, 0] };
    this.from = this.ZERO;
  }
  componentDidMount() { this.animate(this.ZERO); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  ease(x) { return 1 - Math.pow(1 - x, 3); }
  target() { const d = this.DATA[this.state.book]; return { income: d.income, expense: d.expense, series: d.series, cats: d.cats.map(c => c[1]) }; }
  current() {
    const t = this.target(), f = this.from, e = this.ease(this.state.p), L = (a, b) => a + (b - a) * e;
    return { income: L(f.income, t.income), expense: L(f.expense, t.expense), series: t.series.map((v, i) => L(f.series[i], v)), cats: t.cats.map((v, i) => L(f.cats[i], v)) };
  }
  animate(from) {
    cancelAnimationFrame(this.raf);
    this.from = from;
    const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 700); this.setState({ p: k }); if (k < 1) this.raf = requestAnimationFrame(step); };
    this.setState({ p: 0 });
    this.raf = requestAnimationFrame(step);
  }
  pick(id) { if (id === this.state.book) return; const cur = this.current(); this.setState({ book: id }); this.animate(cur); }
  fmt(n) { const [i, f] = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + f + ' €'; }
  renderVals() {
    const v = this.current(), d = this.DATA[this.state.book];
    const W = 318, top = 12, bottom = 104, max = 1500;
    const pts = v.series.map((s, i) => [5 + i * (W - 10) / 10, bottom - (s / max) * (bottom - top)]);
    let line = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      line += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    const last = pts[pts.length - 1];
    const colors = ['#FF6B4A', '#FFB340', '#30B0C7', '#5E5CE6', '#C7C7CC'];
    const full = d.cats.reduce((a, c) => a + c[1], 0);
    const ids = ['all', 'personal', 'miora'], idx = ids.indexOf(this.state.book);
    return {
      bookName: d.name,
      net: this.fmt(v.income - v.expense), income: this.fmt(v.income), expense: this.fmt(v.expense),
      line, area: line + ' L' + last[0].toFixed(1) + ' ' + bottom + ' L' + pts[0][0] + ' ' + bottom + ' Z',
      lastX: last[0].toFixed(1), lastY: last[1].toFixed(1),
      thumb: 'position: absolute; top: 2px; bottom: 2px; left: calc(2px + ' + idx + ' * (100% - 4px) / 3); width: calc((100% - 4px) / 3); background: #FFFFFF; border-radius: 7px; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); transition: left .35s cubic-bezier(.3,1.3,.5,1)',
      books: [['all', '全部'], ['personal', '个人'], ['miora', 'Miora 美甲店']].map(([id, name]) => ({ name, pick: () => this.pick(id),
        style: 'flex: 1; position: relative; z-index: 1; border: 0; background: transparent; font: inherit; font-size: 13px; height: 30px; cursor: pointer; color: #1D1D1F; ' + (this.state.book === id ? 'font-weight: 600' : 'font-weight: 400') })),
      cats: d.cats.map((c, i) => ({ name: c[0], amt: Math.round(c[1]).toLocaleString('de-DE') + ' €',
        dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + colors[i],
        bar: 'height: 10px; background: ' + colors[i] + '; width: ' + (v.cats[i] / full * 100).toFixed(2) + '%' })),
    };
  }
}
</script>
</body>
</html>
