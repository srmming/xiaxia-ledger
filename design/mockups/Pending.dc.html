<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>夏夏账本 · 待确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D6}a:hover{color:#084FA8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #ECECEC; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #C9C9C9">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #F6F6F6; border-bottom: 1px solid #D8D8D8">
    <div style="display: flex; gap: 8px; width: 204px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span></div>
    <div style="font-size: 15px; font-weight: 600">待确认</div>
    <div style="flex-grow: 1"></div>
    <button style="height: 28px; padding: 0 12px; border: 1px solid #CFCFCF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px">全部撤销</button>
    <button style="height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: #0A64D6; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">全部确认</button>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <nav aria-label="侧边栏" style="width: 220px; flex-shrink: 0; background: #E8E6EA; border-right: 1px solid #D4D4D4; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 6px 8px">夏夏账本</div>
      <a href="Main.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">▦ 总览</a>
      <a href="Trends.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">↗ 趋势与分类</a>
      <a href="Transactions.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">☰ 流水</a>
      <a href="Pending.dc.html" style="padding: 6px 8px; border-radius: 6px; background: #D5D3DA; color: #1D1D1F; text-decoration: none; font-weight: 600">◎ 待确认</a>
      <a href="Import.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">⇩ 导入</a>
    </nav>
    <main style="flex-grow: 1; background: #FFFFFF; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">3 项改动等你确认</h1>
        <span style="font-size: 12px; color: #6E6E73">确认前不计入报表 · 确认后也能在「历史」里撤销</span>
      </div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 11px; font-weight: 600; background: #FFF4EE; color: #8A3416; border-radius: 4px; padding: 2px 8px">{{it.kind}}</span>
            <span style="font-weight: 600; font-size: 14px; flex-grow: 1">{{it.title}}</span>
            <span style="font-size: 12px; color: #6E6E73">{{it.who}}</span>
          </div>
          <div style="font-size: 13px; color: #3A3A3C">{{it.detail}}</div>
          <div style="display: flex; gap: 8px; justify-content: flex-end">
            <button style="height: 28px; padding: 0 12px; border: 1px solid #CFCFCF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px">查看 {{it.count}} 笔</button>
            <button style="height: 28px; padding: 0 12px; border: 1px solid #CFCFCF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px">撤销</button>
            <button style="height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: #0A64D6; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">确认</button>
          </div>
        </section>
      </sc-for>
      <div style="flex-grow: 1"></div>
      <section style="background: #F5F5F7; border-radius: 10px; padding: 12px 16px; font-size: 12px; color: #3A3A3C; display: flex; flex-direction: column; gap: 6px">
        <div style="font-weight: 600; color: #1D1D1F">最近确认</div>
        <div>11 月 20 日 · ming 确认 · imagin 11 月对账单，导入 42 笔，跳过重复 6 笔</div>
        <div>11 月 19 日 · ming 确认 · 18 笔改分类为「店铺耗材」</div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { kind: '导入', title: 'Revolut 11 月对账单', who: 'Claude · 今天 09:12', detail: '新增 37 笔，跳过和已有流水重复的 4 笔。35 笔已自动分类，2 笔拿不准账本，放进下面一项。', count: 37 },
      { kind: '分账本', title: '2 笔不确定属于个人还是美甲店', who: 'Claude · 今天 09:12', detail: 'Amazon 订单 -34,99 €、Leroy Merlin -58,20 €。Claude 猜是美甲店（店铺耗材），请确认或改成个人。', count: 2 },
      { kind: '账本间转账', title: '识别到一笔老板提款', who: 'Claude · 今天 09:13', detail: '11 月 12 日 imagin -600,00 € 和 CaixaBank +600,00 € 配成一对：美甲店记「老板提款」，个人记「收入」，汇总时抵消。', count: 2 },
    ] };
  }
}
</script>
</body>
</html>
