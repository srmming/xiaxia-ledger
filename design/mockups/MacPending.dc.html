<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>夏夏账本 Mac · 待确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#D9472B}a:hover{color:#B23A22}
@keyframes xx-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes xx-draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes xx-grow{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.xx-fade{animation:xx-in .35s cubic-bezier(.2,.8,.2,1) both}
.xx-nav:hover{background:rgba(0,0,0,.05)}
.xx-done-ring{animation:xx-grow .5s cubic-bezier(.2,.8,.2,1) both}
.xx-done-check{stroke-dasharray:40;animation:xx-draw .45s .2s ease-out both}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; display: flex; border-radius: 14px; overflow: hidden; background: #FBFBFD; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 30px 60px rgba(0,0,0,.18)">
  <nav aria-label="侧边栏" style="width: 232px; flex-shrink: 0; background: linear-gradient(180deg, #EFEDF1 0%, #E9E7EC 100%); border-right: 1px solid rgba(0,0,0,.08); padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
    <div style="display: flex; gap: 8px; padding: 2px 6px 22px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span></div>
    <div style="font-size: 11px; font-weight: 600; color: #86868B; padding: 0 10px 6px">账本</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1D1D1F"></span>全部</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #30B0C7"></span>个人</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF6B4A"></span>Miora 美甲店</div>
    <div style="font-size: 11px; font-weight: 600; color: #86868B; padding: 18px 10px 6px">查看</div>
    <a class="xx-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="#6E6E73" stroke-width="1.5"></rect><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="#6E6E73" stroke-width="1.5"></rect><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5" fill="none" stroke="#6E6E73" stroke-width="1.5"></rect><rect x="9" y="9" width="5.5" height="5.5" rx="1.5" fill="none" stroke="#6E6E73" stroke-width="1.5"></rect></svg>总览</a>
    <a class="xx-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l4-4 3 3 5-6" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>趋势与分类</a>
    <a class="xx-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h7" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round"></path></svg>流水</a>
    <a href="MacPending.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none; background: rgba(0,0,0,.07); font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="#D9472B" stroke-width="1.6"></circle><path d="M5.5 8.2l1.8 1.8 3.4-3.6" fill="none" stroke="#D9472B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex-grow: 1">待确认</span><sc-if value="{{hasLive}}" hint-placeholder-val="{{ true }}"><span style="background: #FF6B4A; color: #FFFFFF; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 1px 7px">{{liveCount}}</span></sc-if></a>
    <a class="xx-nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 12.5v1h11v-1" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>导入</a>
  </nav>
  <div style="width: 330px; flex-shrink: 0; border-right: 1px solid rgba(0,0,0,.08); background: #FFFFFF; display: flex; flex-direction: column">
    <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid rgba(0,0,0,.06)">
      <div style="display: flex; flex-direction: column; gap: 1px"><h1 style="margin: 0; font-size: 17px; font-weight: 700">待确认</h1><span style="font-size: 12px; color: #86868B">{{subtitle}}</span></div>
      <sc-if value="{{hasLive}}" hint-placeholder-val="{{ true }}"><button onClick="{{confirmAll}}" style="height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: rgba(255,107,74,.12); color: #C2381C; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">全部确认</button></sc-if>
    </div>
    <div style="padding: 10px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <div style="{{it.wrap}}">
          <button onClick="{{it.select}}" style="{{it.btn}}">
            <span style="{{it.dot}}"></span>
            <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left; min-width: 0"><span style="font-size: 13px; font-weight: 600">{{it.title}}</span><span style="font-size: 12px; color: #86868B">{{it.kind}} · {{it.who}}</span></span>
          </button>
        </div>
      </sc-for>
    </div>
  </div>
  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; background: #F5F5F7">
    <sc-if value="{{sel}}" hint-placeholder-val="{{ true }}">
      <div class="xx-fade" style="{{detailStyle}}">
        <div style="display: flex; align-items: center; gap: 10px"><span style="{{sel.tag}}">{{sel.kind}}</span><span style="font-size: 12px; color: #86868B">{{sel.who}}</span></div>
        <h2 style="margin: 0; font-size: 24px; font-weight: 700">{{sel.title}}</h2>
        <p style="margin: 0; font-size: 14px; color: #3A3A3C; line-height: 1.5; max-width: 560px">{{sel.detail}}</p>
        <section style="background: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05)">
          <div style="display: grid; grid-template-columns: 70px 1fr 150px 110px; gap: 12px; padding: 10px 16px; font-size: 11px; font-weight: 600; color: #86868B; border-bottom: 1px solid #F0F0F2"><span>日期</span><span>描述</span><span>改动</span><span style="text-align: right">金额</span></div>
          <sc-for list="{{sel.rows}}" as="r" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 70px 1fr 150px 110px; gap: 12px; padding: 10px 16px; font-size: 13px; border-bottom: 1px solid #F5F5F7; align-items: center"><span style="color: #86868B; font-variant-numeric: tabular-nums">{{r.d}}</span><span>{{r.desc}}</span><span style="font-size: 12px"><span style="color: #AEAEB2; text-decoration: line-through">{{r.from}}</span> <span style="color: #C2381C; font-weight: 600">→ {{r.to}}</span></span><span style="{{r.amtStyle}}">{{r.amt}}</span></div>
          </sc-for>
        </section>
        <div style="flex-grow: 1"></div>
        <div style="display: flex; gap: 10px; justify-content: flex-end">
          <button onClick="{{sel.undo}}" style="height: 32px; padding: 0 18px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,.1); font: inherit; font-size: 13px; cursor: pointer">撤销</button>
          <button onClick="{{sel.ok}}" style="height: 32px; padding: 0 22px; border: 0; border-radius: 8px; background: #FF6B4A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">确认 ⏎</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
        <svg class="xx-done-ring" width="80" height="80" viewBox="0 0 88 88" role="img" aria-label="全部处理完"><circle cx="44" cy="44" r="40" fill="#34C759"></circle><path class="xx-done-check" d="M28 45l11 11 21-23" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="font-size: 20px; font-weight: 700">都处理完了</div>
        <div style="font-size: 13px; color: #86868B">确认的改动已经进了报表，历史里还能撤销。</div>
        <button onClick="{{reset}}" style="border: 0; background: transparent; font: inherit; font-size: 13px; color: #D9472B; cursor: pointer">再演示一次</button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: this.fresh(), sel: 'a' }; this.timers = []; }
  fresh() { return { a: 'live', b: 'live', c: 'live' }; }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  fmt(n) { const [i, f] = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '+') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + f + ' €'; }
  act(id, how, delay) {
    const go = () => {
      const st = { ...this.state.st, [id]: how };
      const next = ['a', 'b', 'c'].find(k => st[k] === 'live');
      this.setState({ st, sel: next || null });
      this.timers.push(setTimeout(() => this.setState({ st: { ...this.state.st, [id]: 'gone' } }), 420));
    };
    if (delay) this.timers.push(setTimeout(go, delay)); else go();
  }
  renderVals() {
    const ITEMS = [
      { id: 'a', kind: '导入', color: '#30B0C7', who: 'Claude · 今天 09:12', title: 'Revolut 11 月对账单', detail: '新增 37 笔，跳过和已有流水重复的 4 笔。35 笔已自动分类，下面是其中几笔。',
        rows: [['11-18', 'Metro Madrid', '未分类', '交通', -21.8], ['11-17', 'Mercadona Usera', '未分类', '超市', -31.8], ['11-15', 'Bizum Ana', '未分类', '美甲服务', 45], ['11-01', 'Spotify', '未分类', '订阅', -10.99]] },
      { id: 'b', kind: '分账本', color: '#FFB340', who: 'Claude · 今天 09:12', title: '2 笔拿不准账本', detail: 'Claude 猜是美甲店的店铺耗材。确认就按这样记，撤销会改回「未分账本」，你再手动选。',
        rows: [['11-09', 'Amazon 订单', '未分账本', 'Miora · 耗材', -34.99], ['11-06', 'Leroy Merlin', '未分账本', 'Miora · 耗材', -58.2]] },
      { id: 'c', kind: '账本间转账', color: '#5E5CE6', who: 'Claude · 今天 09:13', title: '识别到一笔老板提款', detail: '两笔同日同额配成一对：美甲店记「老板提款」，个人记「收入」，看「全部」时互相抵消，不重复算。',
        rows: [['11-12', 'imagin 转出', '普通支出', 'Miora · 老板提款', -600], ['11-12', 'CaixaBank 转入', '普通收入', '个人 · 收入', 600]] },
    ];
    const st = this.state.st;
    const live = ITEMS.filter(i => st[i.id] === 'live');
    const s = ITEMS.find(i => i.id === this.state.sel && st[i.id] === 'live');
    return {
      items: ITEMS.filter(i => st[i.id] !== 'gone').map(i => {
        const leaving = st[i.id] !== 'live', on = s && s.id === i.id;
        return { ...i, select: () => this.setState({ sel: i.id }),
          wrap: 'max-height: ' + (leaving ? '0' : '80px') + '; opacity: ' + (leaving ? '0' : '1') + '; transform: translateX(' + (leaving ? (st[i.id] === 'ok' ? '30px' : '-30px') : '0') + '); overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .25s, transform .3s',
          btn: 'width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 10px; font: inherit; color: #1D1D1F; cursor: pointer; transition: background .2s; ' + (on ? 'background: rgba(255,107,74,.12)' : 'background: transparent'),
          dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + i.color };
      }),
      sel: s ? { ...s, ok: () => this.act(s.id, 'ok'), undo: () => this.act(s.id, 'undo'),
        tag: 'font-size: 12px; font-weight: 600; color: #FFFFFF; background: ' + s.color + '; border-radius: 6px; padding: 2px 8px',
        rows: s.rows.map(r => ({ d: r[0], desc: r[1], from: r[2], to: r[3], amt: this.fmt(r[4]), amtStyle: 'text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: ' + (r[4] > 0 ? '#1F8A5B' : '#1D1D1F') })) } : null,
      detailStyle: 'flex-grow: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px',
      liveCount: live.length, hasLive: live.length > 0,
      subtitle: live.length ? live.length + ' 项 AI 的改动' : '全部处理完',
      allDone: live.length === 0,
      confirmAll: () => live.forEach((i, n) => this.act(i.id, 'ok', n * 140)),
      reset: () => this.setState({ st: this.fresh(), sel: 'a' }),
    };
  }
}
</script>
</body>
</html>
