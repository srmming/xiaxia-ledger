<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>夏夏账本 · 趋势与分类</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D6}a:hover{color:#084FA8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #ECECEC; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #C9C9C9">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #F6F6F6; border-bottom: 1px solid #D8D8D8">
    <div style="display: flex; gap: 8px; width: 204px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span></div>
    <div style="font-size: 15px; font-weight: 600">趋势与分类</div>
    <div style="flex-grow: 1"></div>
    <div role="group" aria-label="账本" style="display: flex; background: #E3E3E3; border-radius: 7px; padding: 2px; gap: 2px; font-size: 13px">
      <button style="border: 0; border-radius: 5px; padding: 4px 14px; font: inherit; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.18); font-weight: 600">全部</button>
      <button style="border: 0; border-radius: 5px; padding: 4px 14px; font: inherit; background: transparent; color: #3A3A3C">个人</button>
      <button style="border: 0; border-radius: 5px; padding: 4px 14px; font: inherit; background: transparent; color: #3A3A3C">Miora 美甲店</button>
    </div>
    <div style="flex-grow: 1"></div>
    <div role="group" aria-label="时间范围" style="display: flex; background: #E3E3E3; border-radius: 7px; padding: 2px; gap: 2px; font-size: 13px">
      <button style="border: 0; border-radius: 5px; padding: 4px 12px; font: inherit; background: transparent; color: #3A3A3C">6 个月</button>
      <button style="border: 0; border-radius: 5px; padding: 4px 12px; font: inherit; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.18); font-weight: 600">今年</button>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <nav aria-label="侧边栏" style="width: 220px; flex-shrink: 0; background: #E8E6EA; border-right: 1px solid #D4D4D4; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="font-size: 11px; font-weight: 600; color: #6E6E73; padding: 6px 8px">夏夏账本</div>
      <a href="Main.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">▦ 总览</a>
      <a href="Trends.dc.html" style="padding: 6px 8px; border-radius: 6px; background: #D5D3DA; color: #1D1D1F; text-decoration: none; font-weight: 600">↗ 趋势与分类</a>
      <a href="Transactions.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">☰ 流水</a>
      <a href="Pending.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">◎ 待确认</a>
      <a href="Import.dc.html" style="padding: 6px 8px; border-radius: 6px; color: #1D1D1F; text-decoration: none">⇩ 导入</a>
    </nav>
    <main style="flex-grow: 1; background: #FFFFFF; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">2026 年 1–11 月 · 全部账本</h1>
      <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; height: 300px; box-sizing: border-box">
        <div style="display: flex; justify-content: space-between"><h2 style="margin: 0; font-size: 14px; font-weight: 600">每月结余</h2><span style="font-size: 12px; color: #6E6E73">累计结余 <b style="color: #136B5E; font-variant-numeric: tabular-nums">12.684,20 €</b></span></div>
        <div style="flex-grow: 1; display: flex; align-items: flex-end; gap: 14px; border-bottom: 1px solid #E5E5EA; padding: 0 4px">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="11">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="font-size: 10px; color: #6E6E73; font-variant-numeric: tabular-nums">{{m.text}}</div><div style="{{m.style}}"></div></div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 14px; padding: 0 4px; font-size: 11px; color: #6E6E73"><sc-for list="{{months}}" as="m" hint-placeholder-count="11"><div style="flex: 1; text-align: center">{{m.label}}</div></sc-for></div>
      </section>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; flex-grow: 1">
        <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 600">支出分类（今年）</h2>
          <sc-for list="{{out}}" as="c" hint-placeholder-count="6">
            <div style="display: grid; grid-template-columns: 90px 1fr 110px; align-items: center; gap: 10px; font-size: 13px"><span>{{c.name}}</span><div style="height: 8px; background: #F0F0F2; border-radius: 4px"><div style="{{c.bar}}"></div></div><span style="text-align: right; font-variant-numeric: tabular-nums">{{c.amount}}</span></div>
          </sc-for>
        </section>
        <section style="border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 600">收入来源（今年）</h2>
          <sc-for list="{{inc}}" as="c" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 90px 1fr 110px; align-items: center; gap: 10px; font-size: 13px"><span>{{c.name}}</span><div style="height: 8px; background: #F0F0F2; border-radius: 4px"><div style="{{c.bar}}"></div></div><span style="text-align: right; font-variant-numeric: tabular-nums">{{c.amount}}</span></div>
          </sc-for>
          <div style="flex-grow: 1"></div>
          <div style="font-size: 12px; color: #6E6E73">「全部」里，店→个人的老板提款两边抵消，不算收入也不算支出。</div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const fmt = (n) => { const [i, f] = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + f + ' €'; };
    const net = [820, 1104, 640, 1320, 980, 1210, 900, 1200, 1200, 1300, 1424];
    const max = 1500;
    const bar = (v, m, c) => 'height: 8px; border-radius: 4px; background: ' + c + '; width: ' + Math.round(v / m * 100) + '%';
    const out = [['房租', 15950], ['工资', 13200], ['店铺耗材', 9480], ['餐饮', 6810], ['店租', 5500], ['交通', 2360]];
    const inc = [['美甲服务', 52300], ['个人工资', 31900], ['退款', 640], ['其他', 1210]];
    return {
      months: net.map((v, i) => ({ label: (i + 1) + '月', text: Math.round(v), style: 'width: 100%; max-width: 32px; border-radius: 4px 4px 0 0; background: #2E9E8F; height: ' + Math.round(v / max * 190) + 'px' })),
      out: out.map(c => ({ name: c[0], amount: fmt(-c[1]), bar: bar(c[1], out[0][1], '#F08A4B') })),
      inc: inc.map(c => ({ name: c[0], amount: fmt(c[1]), bar: bar(c[1], inc[0][1], '#2E9E8F') })),
    };
  }
}
</script>
</body>
</html>
