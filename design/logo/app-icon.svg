<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB36B"/>
      <stop offset="0.55" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#E8505B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8A2230" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS 图标网格：824×824 圆角方块，居中 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- 夏：太阳 -->
  <circle cx="512" cy="430" r="150" fill="url(#sun)" opacity="0.95"/>
  <!-- 账本：打开的书 -->
  <g filter="url(#shadow)">
    <path d="M512 520 C 440 478, 330 470, 236 486 L 236 760 C 330 744, 440 752, 512 794 Z" fill="url(#page)"/>
    <path d="M512 520 C 584 478, 694 470, 788 486 L 788 760 C 694 744, 584 752, 512 794 Z" fill="url(#page)"/>
  </g>
  <!-- 书脊 -->
  <path d="M512 520 L 512 794" stroke="#F3C9B5" stroke-width="6"/>
  <!-- 右页：上升的柱子 = 图表 -->
  <rect x="580" y="640" width="40" height="80" rx="12" fill="#2E9E8F"/>
  <rect x="640" y="600" width="40" height="122" rx="12" fill="#2E9E8F"/>
  <rect x="700" y="555" width="40" height="170" rx="12" fill="#1F7A6E"/>
  <!-- 左页：账目横线 -->
  <rect x="290" y="580" width="160" height="16" rx="8" fill="#F0C2AE"/>
  <rect x="290" y="630" width="130" height="16" rx="8" fill="#F0C2AE"/>
  <rect x="290" y="680" width="150" height="16" rx="8" fill="#F0C2AE"/>
</svg>
