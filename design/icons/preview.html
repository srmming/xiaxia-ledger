<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--sub:#6E6E73;--accent:#FF7A59}
@media (prefers-color-scheme:dark){:root{--bg:#1D1D1F;--card:#2C2C2E;--ink:#F5F5F7;--sub:#A1A1A6;--accent:#FF8A6B}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC",sans-serif;padding:32px 16px}
main{max-width:1040px;margin:auto} h1{font-size:28px;margin:0 0 4px} h2{font-size:18px;margin:36px 0 12px} p{color:var(--sub);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:18px;padding:18px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
figure:hover{transform:translateY(-3px)} figure:hover .ic svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){figure:hover .ic svg{animation:none}}
figcaption{font-size:13px;text-align:center} code{display:block;font-size:11px;color:var(--sub)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px} .app img{width:200px;max-width:100%} .app figcaption{color:var(--sub);padding:0 8px}

<h1>夏夏账本 · 图标草稿 v2</h1><p>风格：layered two-tone。每个图标只用一个颜色：浅色主体（32% 不透明）加实色重点，参考 Kubai Icons 的 Layered 画法，24 网格，圆角实心。tab 图标跟随系统强调色（currentColor），分类图标各有固定颜色。鼠标悬停有小弹跳动效。</p>
